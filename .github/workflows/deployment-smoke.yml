name: Deployment smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wireguard-deployment-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wireguard-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise the deployed board and a disposable peer
        run: pnpm smoke:deployment
        env:
          SMOKE_BOARD_URL: ${{ vars.SMOKE_BOARD_URL }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_API_TOKEN: ${{ secrets.SMOKE_API_TOKEN }}
          SMOKE_BYPASS_SECRET: ${{ secrets.SMOKE_BYPASS_SECRET }}
